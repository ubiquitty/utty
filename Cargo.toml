[package]
name = "utty"
version = "0.1.0"
description = "A terminal client for persistent Ubiquitty workspaces"
repository = "https://github.com/ubiquitty/utty"
readme = "README.md"
publish = false
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
build = "build.rs"
default-run = "utty"

[[bin]]
name = "utty"
path = "src/main.rs"

[[bin]]
name = "utty-capture"
path = "src/bin/capture.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
libc = "0.2"
image = { version = "0.25", default-features = false }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
